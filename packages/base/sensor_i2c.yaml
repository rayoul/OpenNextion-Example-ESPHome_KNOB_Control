i2c:
  sda: GPIO10
  scl: GPIO11
  scan: true

sensor:
  - platform: sht3xd
    address: 0x44
    temperature:
      id: temp_interieure
      name: "Température"
      on_value:
        then:
          - lvgl.widget.refresh: standby_indoor_widget
    humidity:
      id: hum_interieure
      name: "Humidité"
      on_value:
        then:
          - lvgl.widget.refresh: standby_indoor_widget
    update_interval: 60s

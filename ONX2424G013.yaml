substitutions:
  project_name: onx2424g013
  project_friendly_name: ONX2424G013_SHT31-D
  wifi_ssid: NearlyTiny_IOT
  wifi_password: peitavcurr2me
  ap_password: ""
  logger_level: INFO
  uart_baud: "921600"
  standby_timeout_seconds: "300"
  diagnostics_update_interval: 15s
  display_update_interval: 200ms
  lcd_spi_data_rate: 40MHz
  lcd_backlight_default: 100%
  encoder_resolution: "4"
  product_firmware_version: "1.0.1"
  product_firmware_manifest_url: "https://opennextion.github.io/OpenNextion-Example-ESPHome_KNOB_Control/firmware/manifest.json"

packages:
  device: !include packages/base/device.yaml
  connectivity: !include packages/base/connectivity.yaml
  display: !include packages/base/display.yaml
  input: !include packages/base/input.yaml
  diagnostics: !include packages/base/diagnostics.yaml
  mode_router: !include packages/features/mode_router.yaml
  boot_status: !include packages/features/boot_status.yaml
  normal_mode: !include packages/features/normal_mode.yaml
  sensor_i2c: !include packages/base/sensor_i2c.yaml

preferences:
  flash_write_interval: 5s

# Enable AUTHCODE storage in eFuse via compile flag
esphome:
  includes:
    - custom_logic.h
    - custom_logic_entity_sub.h
  name: ${project_name}